name: CookMate Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  analyze_and_test:
    name: Flutter Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'
          cache: true

      - name: Verify Flutter Installation
        run: flutter doctor -v

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Install Core Package Dependencies
        working-directory: packages/cook_mate_core
        run: dart pub get

      - name: Run Core Package Analysis
        working-directory: packages/cook_mate_core
        run: dart analyze --fatal-infos

      - name: Run Core Package Test Suite
        working-directory: packages/cook_mate_core
        run: dart test

      - name: Run Root Static Analysis
        run: flutter analyze --fatal-infos

      - name: Run Root Automated Test Suite
        run: flutter test --coverage

      - name: Check Coverage Artifact
        if: success()
        run: |
          if [ -f coverage/lcov.info ]; then
            echo "Coverage file generated successfully."
          fi

