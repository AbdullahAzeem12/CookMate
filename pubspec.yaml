name: cook_mate
description: "CookMate — Your personal kitchen companion. Premium recipe discovery and cooking companion app."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  cloud_firestore: ^7.1.0
  firebase_core: ^5.1.0
  flutter_riverpod: ^2.6.1
  go_router: ^18.1.1
  intl: ^0.20.3
  shared_preferences: ^2.5.6
  uuid: ^4.6.0

  args: ^2.7.0
  cached_network_image: ^4.0.5
  image_picker: ^1.2.4
  path_provider: ^2.1.6
  image: ^4.12.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/recipes.json
    - assets/images/
